<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koreys Tili Darslari | NextStep</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 800px; background: #fff; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; gap: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    .btn-home { text-decoration: none; background-color: #6c757d; color: white; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .btn-home:hover { background-color: #5a6268; }
    h2 { text-align: center; color: #2c3e50; }
    select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; outline: none; background-color: #fafafa; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background-color: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; }
    .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
    .btn-prev, .btn-next { background-color: #3498db; }
    .btn-youtube { background-color: #e74c3c; text-decoration: none; text-align: center; }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <a href="../index.html" class="btn-home">⬅ Bosh sahifaga qaytish</a>
      <a href="../profil.html" class="btn-home" style="background-color: #2563eb;">👤 Profil</a>
    </div>

    <h2>Koreys Tili Video Darsliklari</h2>

    <div>
      <select id="lessonSelect"></select>
    </div>

    <div class="video-container">
      <iframe id="videoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div class="controls">
      <button id="prevBtn" class="btn btn-prev">⬅ Orqaga</button>
      <button id="watchedBtn" class="btn" style="background-color: #27ae60;">Darsni ko'rib bo'ldim ✅</button>
      <a id="youtubeLink" href="#" target="_blank" class="btn btn-youtube">YouTubedan ko'rish 🔴</a>
      <button id="nextBtn" class="btn btn-next">Keyingisi ➡</button>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="../js/app.js"></script>

  <script>
    let currentIndex = 0;
    const courseType = 'korean';

    const selectEl = document.getElementById('lessonSelect');
    const iframeEl = document.getElementById('videoPlayer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const watchedBtn = document.getElementById('watchedBtn');
    const ytLink = document.getElementById('youtubeLink');

    function getYouTubeId(url) {
      if (!url) return '';
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function updateWatchedBtnUI() {
      const watched = isLessonWatched(courseType, currentIndex);
      if (watched) {
        watchedBtn.style.backgroundColor = '#27ae60';
        watchedBtn.textContent = "Ko'rib bo'lindi ✅";
      } else {
        watchedBtn.style.backgroundColor = '#7f8c8d';
        watchedBtn.textContent = "Darsni ko'rdim deb belgilash ⭕";
      }
    }

    if (typeof koreysDarslar !== 'undefined' && Array.isArray(koreysDarslar)) {
      koreysDarslar.forEach((dars, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${dars.dars}-dars: ${dars.title}`;
        selectEl.appendChild(option);
      });

      function loadLesson(index) {
        if (index < 0 || index >= koreysDarslar.length) return;
        currentIndex = index;
        selectEl.value = currentIndex;
        const videoId = getYouTubeId(koreysDarslar[currentIndex].link);
        iframeEl.src = `https://www.youtube.com/embed/${videoId}?rel=0`;
        ytLink.href = koreysDarslar[currentIndex].link;
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === koreysDarslar.length - 1;
        updateWatchedBtnUI();
      }

      selectEl.addEventListener('change', (e) => loadLesson(parseInt(e.target.value)));
      prevBtn.addEventListener('click', () => { if (currentIndex > 0) loadLesson(currentIndex - 1); });
      nextBtn.addEventListener('click', () => { if (currentIndex < koreysDarslar.length - 1) loadLesson(currentIndex + 1); });
      watchedBtn.addEventListener('click', () => {
        toggleLessonWatched(courseType, currentIndex);
        updateWatchedBtnUI();
      });

      loadLesson(0);
    }
  </script>

</body>
</html>
